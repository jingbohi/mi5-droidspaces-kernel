name: build

# Builds the Mi 5 (gemini) kernel in a Ubuntu 20.04 container.
#
# The kernel is compiled with the AOSP aarch64 gcc 4.9 prebuilt (the version
# Xiaomi's own Image reports), fetched by scripts/fetch-toolchain.sh.  Building
# this tree with the distro cross compiler (gcc 9.4) produces an Image that
# hangs on the phone before console_init() — see docs/BUILD-AND-QEMU.md.
#
#   push to main / PR      -> build + upload artifacts
#   tag v*                 -> build + publish a GitHub release
#   workflow_dispatch      -> build, optionally publish a release
#
# Nothing here patches the phone: it produces boot-mi5-droidspaces.img (CN ROM)
# and boot-mi5-droidspaces-global.img (global ROM) from one kernel Image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release from this run"
        type: boolean
        default: false
      tag:
        description: "Release tag (only used when publish is true)"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  KERNEL_COMMIT: a36928ce4998125d9e71d1377a52d68cfe156872
  KERNEL_BRANCH: scorpio-o-oss
  JOBS: 4
  USE_CCACHE: 1

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        variant: [release, probe]
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            build-essential gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 patch cpio xz-utils gzip kmod \
            ccache qemu-system-arm

      - uses: actions/checkout@v4

      # The AOSP gcc 4.9 wrapper starts with "#!/usr/bin/python", and the probe
      # initramfs is a glibc static binary, hence both compilers above.
      - name: Cache cross toolchain
        uses: actions/cache@v4
        with:
          path: .work/aarch64-linux-android-4.9
          key: toolchain-aarch64-linux-android-4.9-20150123

      - name: Fetch cross toolchain
        run: bash scripts/fetch-toolchain.sh

      - name: Cache kernel source tarball
        uses: actions/cache@v4
        with:
          path: .work/kernel.tar.gz
          key: kernel-${{ env.KERNEL_BRANCH }}-${{ env.KERNEL_COMMIT }}

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: .work/ccache
          key: ccache-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant }}-
            ccache-

      - name: Build ${{ matrix.variant }}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.work/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          ccache --zero-stats || true
          bash scripts/build.sh "${{ matrix.variant }}" "out-${{ matrix.variant }}"
          ccache --show-stats || true

      - name: QEMU smoke test
        if: matrix.variant == 'probe'
        run: |
          bash scripts/qemu_probe.sh dist/Image-probe "dist/qemu-serial.log"
          tail -60 dist/qemu-serial.log

      - uses: actions/upload-artifact@v4
        with:
          name: mi5-kernel-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/mi5-kernel-release/boot-mi5-droidspaces.img release/
          cp artifacts/mi5-kernel-release/boot-mi5-droidspaces-global.img release/
          cp artifacts/mi5-kernel-release/config-diff-release.txt release/
          cp artifacts/mi5-kernel-release/crc-release.txt release/
          cp artifacts/mi5-kernel-release/verify-boot.txt release/
          cp artifacts/mi5-kernel-release/verify-boot-global.txt release/
          cp artifacts/mi5-kernel-probe/qemu-serial.log release/qemu-serial.log
          cd release && sha256sum boot-mi5-droidspaces.img \
            boot-mi5-droidspaces-global.img > SHA256SUMS.txt && cat SHA256SUMS.txt
          ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Mi 5 Droidspaces kernel ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          # Long-form notes live in the repo so they are reviewed like code.
          body_path: .github/RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
